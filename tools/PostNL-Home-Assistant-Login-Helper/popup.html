<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PostNL Login Helper</title><style>*{box-sizing:border-box}body{margin:0;width:360px;background:#f5f5f6;color:#232323;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:18px;background:#fb6200;color:#fff}h1{margin:0;font-size:18px}main{padding:16px}.logo{font-size:31px;font-weight:800;letter-spacing:-2px;margin-bottom:3px}.box{min-height:92px;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,monospace}button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:11px;background:#fb6200;color:#fff;font-weight:750;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#e5e5e7;color:#333}.row{display:flex;gap:8px}.row button{flex:1}.status{margin-top:10px;font-size:12px;color:#666}</style></head><body><header><div class="logo">postnl</div><h1>Home Assistant Login Helper</h1></header><main><p>Sign in to PostNL from the Home Assistant setup screen. The callback is captured automatically.</p><div id="callback" class="box">No PostNL callback captured yet.</div><div class="row"><button id="copy" disabled>Copy callback</button><button id="clear" class="secondary" disabled>Clear</button></div><div id="status" class="status"></div></main><script src="popup.js"></script></body></html>
