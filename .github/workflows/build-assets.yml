name: Build bundled assets

on:
  push:
    branches: [main]
    paths:
      - "tools/PostNL-Home-Assistant-Login-Helper/**"
      - "custom_components/postnl_lrvdlinden/frontend/van-1.svg"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build helper and animated van
        run: |
          python -m pip install --quiet pillow cairosvg
          cd tools/PostNL-Home-Assistant-Login-Helper
          zip -qr ../PostNL-Home-Assistant-Login-Helper.zip .
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import cairosvg
          from PIL import Image
          svg=Path('custom_components/postnl_lrvdlinden/frontend/van-1.svg').read_bytes()
          png=cairosvg.svg2png(bytestring=svg,output_width=190,output_height=125)
          van=Image.open(BytesIO(png)).convert('RGBA')
          frames=[]
          for x in (-185,-110,-35,40,115,190,265,340,415):
              frame=Image.new('RGBA',(480,260),(0,0,0,0))
              frame.alpha_composite(van,(x,70))
              frames.append(frame)
          out=Path('custom_components/postnl_lrvdlinden/frontend/postnl-van.gif')
          frames[0].save(out,save_all=True,append_images=frames[1:],duration=110,loop=0,disposal=2,optimize=True)
          PY
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/PostNL-Home-Assistant-Login-Helper.zip custom_components/postnl_lrvdlinden/frontend/postnl-van.gif
          git commit -m "Build bundled assets for v1.0.0" || true
          git push
      - name: Publish v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 1.0.0 >/dev/null 2>&1 || gh release create 1.0.0 --target main --title "v1.0.0" --notes "PostNL for Home Assistant v1.0.0: PostNL branding, Chrome login helper, five Lovelace cards, animated delivery van and HACS/Home Assistant validation."
