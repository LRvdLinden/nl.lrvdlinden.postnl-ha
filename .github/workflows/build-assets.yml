name: Apply PostNL v1.0.2 release payload

on:
  push:
    branches: [main]
    paths:
      - ".release-assets/v1.0.2/**"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact v1.0.2 repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .release-assets/v1.0.2/code_* | base64 -d > /tmp/postnl-v1.0.2-code.tar.xz
          xz -dc /tmp/postnl-v1.0.2-code.tar.xz | tar -x -C "$GITHUB_WORKSPACE"
          cat .release-assets/v1.0.2/gif_* | base64 -d > custom_components/postnl_lrvdlinden/frontend/postnl-van.gif
          rm -f custom_components/postnl_lrvdlinden/frontend/no-mail-en.svg
          rm -f custom_components/postnl_lrvdlinden/frontend/no-mail-nl.svg
          rm -rf .release-assets/v1.0.2
          rm -f .github/workflows/build-assets.yml

          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/postnl_lrvdlinden/manifest.json').read_text())
          assert manifest['version'] == '1.0.2', manifest
          js = Path('custom_components/postnl_lrvdlinden/frontend/postnl-card.js').read_text()
          active = '\n'.join(line for line in js.splitlines() if 'filter(card=>' not in line)
          assert 'postnl-latest-mail-card' not in active
          assert 'postnl-delivery-image-card' not in active
          assert all(x in js for x in ('postnl-mail-card','postnl-packages-card','postnl-delivery-card'))
          PY
          echo "220d2b8decf979ef75915c6a3857aaddea44e3b1ce600b055a950241c7d1291f  custom_components/postnl_lrvdlinden/frontend/postnl-van.gif" | sha256sum -c -

      - name: Commit v1.0.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release PostNL for Home Assistant v1.0.2"
          git push

      - name: Publish v1.0.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "1.0.2" >/dev/null 2>&1; then
            exit 0
          fi
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          m = re.search(r'^## 1\.0\.2\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          Path('/tmp/release-notes.md').write_text((m.group(1).strip() if m else 'PostNL for Home Assistant 1.0.2') + '\n')
          PY
          gh release create "1.0.2" --target main --title "v1.0.2" --notes-file /tmp/release-notes.md
